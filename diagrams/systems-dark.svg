<text x="646" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1">weak banned</text>
<rect x="466" y="170" width="368" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
<text x="478" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6cb0ff">no fake knowers</text>
<text x="646" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1">no binder demands a knower</text>
<rect x="466" y="212" width="368" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
<text x="478" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6cb0ff">the guard ▷, inherited</text>
<text x="646" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1">inherited, not added</text>
<rect x="466" y="254" width="368" height="30" rx="8" fill="#161b22" stroke="#6cb0ff"/>
<text x="478" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#6cb0ff">[content] ⊢ trace</text>
<text x="646" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6cb0ff">recorded, not discarded</text>
<text x="450" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">Both laws absolute theorems, fixpoints included.</text>
<text x="450" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#6cb0ff">no_vanishing_restricted · no_contraction_restricted</text>
<rect x="30" y="382" width="820" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="48" y="408" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">What the machines say</text>
<text x="48" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9198a1">unrestricted_counterexample ⇒ admitted     ·     counterexample_not_armed ⇒ forbidden twice</text>
<text x="48" y="452" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">Not a proof of safety — a proof of why safety requires a structural guard.</text>
